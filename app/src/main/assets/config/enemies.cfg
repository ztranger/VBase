# Ростер мобов (враги спавнеров). Формат тот же, что characters.cfg (парсер общий).
# KayKit Skeletons (CC0), общий с героями риг (41 кость) + набор анимаций.
# hide eyes — прячем меш глаз (материал Glow без текстуры; иначе артефакт на атласе).
#
# Порядок строк = индекс типа моба (сервер выставляет enemy.charType = spawnedCount % N).
# walk/run резолвятся по имени автоматически; attack — для будущей анимации удара по ядру.
# target core|building — цель пути (ядро, если достижимо; иначе / всегда для building —
# ближайшая враждебная постройка по длине пути).

# Статы (сервер): hp / damage / speed / atkint (сек между ударами). 0 = дефолт из building enemy.
character skeleton_warrior name Скелет-воин      model models/Skeleton_Warrior.glb scale 1.0 yaw 0 hide eyes attack 1H_Melee_Attack_Chop           hp 60 damage 12 speed 2.2 atkint 1.2 target core
character skeleton_minion  name Скелет-миньон    model models/Skeleton_Minion.glb  scale 0.85 yaw 0 hide eyes attack Unarmed_Melee_Attack_Punch_A   hp 18 damage 4  speed 4.0 atkint 0.7 target building
character skeleton_rogue   name Скелет-разбойник model models/Skeleton_Rogue.glb   scale 1.0 yaw 0 hide eyes attack Dualwield_Melee_Attack_Slice   hp 30 damage 8  speed 3.4 atkint 0.7 target core
character skeleton_mage    name Скелет-маг       model models/Skeleton_Mage.glb    scale 1.0 yaw 0 hide eyes attack Spellcast_Shoot                hp 24 damage 10 speed 2.6 atkint 1.5 target core
