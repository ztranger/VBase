# Типы зданий/сущностей: параметры геймплея + тексты для панели информации + визуал.
# Единый источник настроек — сцена только РАЗМЕЩАЕТ, параметры берутся отсюда.
# Формат: блок `building <тип>`, далее `name`/`desc` (весь остаток строки) и числа.
# Визуал (клиент): `shape cube <s>` | `shape sphere <r> [stacks] [slices]`,
#                  `material <lit|phong|unlit> <r> <g> <b>`, `yoffset <f>`, `pickradius <f>`.

building generator
name Генератор ресурса
desc Производит ресурс и отправляет его в хранилища базы. Строй больше генераторов, чтобы качать ресурс быстрее.
rate 5
cost 30
hp 80
shape cube 1.0
material lit 0.35 0.80 0.40
yoffset 0.5
pickradius 1.0

building storage
name Хранилище
desc Хранит ресурс базы и задаёт потолок накоплений. Больше хранилищ — выше максимум.
cap 100
cost 40
hp 80
shape cube 1.4
material lit 0.35 0.55 0.95
yoffset 0.7
pickradius 1.2

building spawner
name Спавнер врагов
desc Бесконечные волны: выпускает врагов волнами, каждая следующая больше. Ломай спавнер, чтобы остановить.
interval 1.2
max 12
# Бесконечные волны: wavesize врагов в волне (+wavegrow за каждую волну), pause сек между волнами.
# wavesize 0 => легаси-режим (спавн до max, затем стоп).
wavesize 5
wavepause 6
wavegrow 1
shape cube 1.2
material lit 0.55 0.35 0.75
# Модель — врата-портал (KayKit dungeon). scale 0.8, yaw 90 (если врата смотрят не туда —
# поменяй yaw: 0/90/180/270). Общий атлас dungeon_texture.png.
model models/dungeon/wall_archedwindow_gated.obj textures/dungeon_texture.png 0.8 90
yoffset 0
pickradius 1.6

building core
name Ядро базы
desc Сердце базы. Если враги прорвутся и разрушат его — поражение. Защищай его.
hp 280
shape sphere 1.0 16 24
material phong 0.95 0.85 0.35
# Модель — золотой сундук (KayKit dungeon), scale 1.5. Общий атлас dungeon_texture.png.
model models/dungeon/chest_gold.obj textures/dungeon_texture.png 1.5 0
yoffset 0
pickradius 1.3

building tower
name Башня
desc Автоматически стреляет по ближайшему врагу в радиусе. Основная защита базы.
damage 4
range 6
interval 0.8
cost 40
hp 80
shape cube 0.9
material phong 0.70 0.72 0.78
# Модель — декорированная колонна-шпиль (KayKit dungeon), scale 0.8. Стреляет болтом (клиент).
model models/dungeon/pillar_decorated.obj textures/dungeon_texture.png 0.8 0
yoffset 0
pickradius 1.0

building hero
name Герой
desc Строит базу и защищает её. Враги рядом бьют героя; при 0 HP — повержен и возрождается.
hp 100
rate 5

building enemy
name Враг
desc Бежит к ядру базы, а добежав — бьёт его, пока не разрушит. Убей его раньше.
hp 30
damage 10
interval 1.0
shape sphere 0.35 12 16
material lit 0.85 0.25 0.25
yoffset 0.35
pickradius 0.6
