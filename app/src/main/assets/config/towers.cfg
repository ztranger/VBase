# Виды защиты, которые герой строит в бою: башни-стрелки и напольные ловушки.
# Индекс записи (сверху вниз, с 0) = «вид» (kind) — сетевой контракт: едет клиенту в младшем
# ниббле EntityState.charType у Tower/Trap (тир — в старшем ниббле). Порядок НЕ переставлять
# без бампа kProtocolVersion (Net.h). class решает тег сущности: tower (стреляет, блокирует путь,
# ломаема мобами) либо trap (на полу, путь НЕ блокирует, мобы проходят по ней).
#
# Формат (по строке): tower <id> [class tower|trap] [name <слово>] cost <c> hp <h>
#   rate <r> range <rg> damage <d> [effect none|slow|splash|burn] [slow <f>] [dur <s>]
#   [splash <rad>] [burn <dps>] [maxtier <n>] [dmgmul <m>] [rangemul <m>] [ratemul <m>]
#   [upcost <m>] [color <r> <g> <b>]
# Апгрейд: статы на тире T = база*mul^(T-1); цена T->T+1 = cost*upcost*T. rate — интервал (падает).

tower arrow  class tower name Стрелок  cost 40 hp 80 rate 0.8 range 6.0 damage 4  effect none   maxtier 3 color 0.78 0.80 0.86
tower frost  class tower name Мороз    cost 55 hp 70 rate 1.0 range 5.5 damage 2  effect slow   slow 0.5 dur 2.0   maxtier 3 color 0.45 0.75 1.00
tower cannon class tower name Пушка    cost 70 hp 95 rate 1.8 range 6.5 damage 6  effect splash splash 2.2         maxtier 3 color 0.88 0.62 0.34
tower fire   class tower name Огонь    cost 65 hp 75 rate 1.2 range 5.5 damage 3  effect burn   burn 4 dur 3.0     maxtier 3 color 1.00 0.45 0.22
tower spike  class trap  name Шипы     cost 25 hp 40 rate 0.8 range 1.5 damage 5  effect none   maxtier 3 dmgmul 1.5 color 0.62 0.22 0.20
