# Ростер выбираемых персонажей (KayKit Adventurers, CC0).
# Формат: character <id> name <имя> model <путь> scale <s> yaw <o> hide <подстроки> attack <клип>
# hide  — подстроки имён узлов-реквизита, которые прятать (лишнее оружие/книги), через запятую.
# attack — имя клипа атаки (резолвится по имени; общий набор из 76 анимаций у всех).
#
# ВАЖНО: порядок строк = сетевой индекс персонажа (charType в снапшоте, Net.h).
# При перестановке/удалении бампать kProtocolVersion. Имя — один токен (без пробелов).
#
# Статы героя (сервер): hp (живучесть) и speed (скорость бега). 0 = дефолт (building hero / 6).
# damage/atkint у героев не используются (герой пока не наносит урон). speed синхронно влияет
# на клиентское предсказание (Scene::selectCharacter ставит player_.maxSpeed).

character mage         name Маг                  model models/Mage.glb         scale 1.0 yaw 0 hide wand,spellbook                          attack Spellcast_Shoot                 hp 80  speed 6.0
character barbarian    name Варвар               model models/Barbarian.glb    scale 1.0 yaw 0 hide offhand,2h_axe,mug                       attack 1H_Melee_Attack_Chop            hp 160 speed 5.0
character knight       name Рыцарь               model models/Knight.glb       scale 1.0 yaw 0 hide offhand,2h_sword,badge,rectangle,spike   attack 1H_Melee_Attack_Slice_Diagonal  hp 140 speed 5.5
character rogue        name Разбойник            model models/Rogue.glb        scale 1.0 yaw 0 hide crossbow,throwable                       attack Dualwield_Melee_Attack_Slice    hp 90  speed 7.5
character rogue_hooded name Разбойник-в-капюшоне model models/Rogue_Hooded.glb scale 1.0 yaw 0 hide crossbow,throwable                       attack Dualwield_Melee_Attack_Slice    hp 90  speed 7.5
