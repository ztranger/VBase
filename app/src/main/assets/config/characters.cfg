# Ростер выбираемых персонажей (KayKit Adventurers, CC0).
# Формат: character <id> name <имя> model <путь> scale <s> yaw <o> hide <подстроки> attack <клип>
# hide  — подстроки имён узлов-реквизита, которые прятать (лишнее оружие/книги), через запятую.
# attack — имя клипа атаки (резолвится по имени; общий набор из 76 анимаций у всех).
#
# ВАЖНО: порядок строк = сетевой индекс персонажа (charType в снапшоте, Net.h).
# При перестановке/удалении бампать kProtocolVersion. Имя — один токен (без пробелов).
#
# Статы героя (сервер): hp (живучесть), speed (скорость бега). speed синхронно влияет на
# клиентское предсказание (Scene::selectCharacter ставит player_.maxSpeed).
# АВТО-АТАКА героя: damage (урон), atkint (сек между атаками), range (дальность, world;
# 0 = не атакует), ranged (флаг: стреляет снарядом — маг; иначе melee — ближний бой).
# Герой автоматически бьёт ближайшего врага в range при наличии линии видимости (нет стены).

character mage         name Маг                  model models/Mage.glb         scale 1.0 yaw 0 hide wand,spellbook                          attack Spellcast_Shoot                 hp 80  speed 6.0  damage 18 atkint 1.1  range 11 ranged
character barbarian    name Варвар               model models/Barbarian.glb    scale 1.0 yaw 0 hide offhand,2h_axe,mug                       attack 1H_Melee_Attack_Chop            hp 160 speed 5.0  damage 34 atkint 1.3  range 2.6 melee
character knight       name Рыцарь               model models/Knight.glb       scale 1.0 yaw 0 hide offhand,2h_sword,badge,rectangle,spike   attack 1H_Melee_Attack_Slice_Diagonal  hp 140 speed 5.5  damage 26 atkint 1.0  range 2.6 melee
character rogue        name Разбойник            model models/Rogue.glb        scale 1.0 yaw 0 hide crossbow,throwable                       attack Dualwield_Melee_Attack_Slice    hp 90  speed 7.5  damage 13 atkint 0.55 range 2.2 melee
character rogue_hooded name Разбойник-в-капюшоне model models/Rogue_Hooded.glb scale 1.0 yaw 0 hide crossbow,throwable                       attack Dualwield_Melee_Attack_Slice    hp 90  speed 7.5  damage 13 atkint 0.55 range 2.2 melee
