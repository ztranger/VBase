# Список сцен для выбора в клиенте (меню -> Сцена). Формат строки:
#   <путь> <отображаемое имя ...>
# Путь читается через AssetSource (работает и на десктопе, и на Android).

scenes/default.scene    По умолчанию (стена-угол)
scenes/arena_open.scene    Открытая арена (база)
scenes/maze.scene    Лабиринт: серпантин
scenes/pillars.scene    Лес колонн (решётка)
scenes/sealed.scene    Запечатанное ядро (прогрыз)
scenes/rings.scene    Кольца (спираль внутрь)
scenes/maze_dfs_s.scene    DFS-лабиринт 4x4
scenes/maze_dfs_l.scene    DFS-лабиринт 6x6
