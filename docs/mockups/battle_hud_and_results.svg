</g>
<text x="310" y="372" font-size="11" fill="#7A6A58">мёртв → «Возрождение 3с» на месте бара</text>

<text x="20" y="474" font-size="17" font-weight="500" fill="#6a6a68">Экран победы / поражения (оверлей поверх боя)</text>

<rect x="20" y="484" width="660" height="372" rx="8" fill="#0F0C09"/>
<rect x="20" y="484" width="660" height="372" rx="8" fill="#1A1410" fill-opacity="0.4" stroke="#4A3F35" stroke-width="1.5"/>

<g>
<rect x="196" y="506" width="308" height="330" rx="10" fill="#2A221C" stroke="#E8A13A" stroke-width="2"/>
<text x="350" y="546" font-size="24" font-weight="500" text-anchor="middle" fill="#FFD36A">Победа</text>
<text x="350" y="566" font-size="11" text-anchor="middle" fill="#8a7a68">поражение — тот же лейаут, danger-цвет</text>
<line x1="216" y1="580" x2="484" y2="580" stroke="#4A3F35"/>

<circle cx="224" cy="606" r="5" fill="#E8A13A"/><text x="238" y="610" font-size="14" fill="#F2E6D4">Волны пройдено</text><text x="484" y="610" font-size="14" text-anchor="end" fill="#F2E6D4">8</text>
<circle cx="224" cy="634" r="5" fill="#3D9E5A"/><text x="238" y="638" font-size="14" fill="#F2E6D4">Время боя</text><text x="484" y="638" font-size="14" text-anchor="end" fill="#F2E6D4">4:32</text>
<circle cx="224" cy="662" r="5" fill="#E8A13A"/><text x="238" y="666" font-size="14" fill="#F2E6D4">Врагов убито</text><text x="484" y="666" font-size="14" text-anchor="end" fill="#F2E6D4">142</text>
<circle cx="224" cy="690" r="5" fill="#3D9E5A"/><text x="238" y="694" font-size="14" fill="#F2E6D4">Ядро осталось</text><text x="484" y="694" font-size="14" text-anchor="end" fill="#F2E6D4">78%</text>

<line x1="216" y1="712" x2="484" y2="712" stroke="#4A3F35"/>
<circle cx="224" cy="736" r="5" fill="#A855F7"/><text x="350" y="740" font-size="14" text-anchor="middle" fill="#C9A0F7">+120 золота    +350 опыта</text>

<rect x="216" y="764" width="80" height="34" rx="6" fill="#332820" stroke="#E8A13A"/><text x="256" y="786" font-size="12" text-anchor="middle" fill="#E8A13A">Ещё раз</text>
<rect x="306" y="764" width="80" height="34" rx="6" fill="#332820" stroke="#7A6A58"/><text x="346" y="786" font-size="12" text-anchor="middle" fill="#F2E6D4">В лобби</text>
<rect x="396" y="764" width="88" height="34" rx="6" fill="#E8A13A"/><text x="440" y="786" font-size="12" text-anchor="middle" fill="#2A221C">В меню</text>
<text x="350" y="818" font-size="11" text-anchor="middle" fill="#8a7a68">«Ещё раз» / «В лобби» — нужен запрос рестарта на сервер</text>
</g>
</svg>
